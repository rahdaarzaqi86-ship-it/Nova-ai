const PRAISE = ["Mantap!", "Betul!", "Keren!", "Jempolan!", "Tepat sekali!"];
const STORAGE_KEY = "nova-ai-progress";
const MAX_ENERGY = 2;
const SIX_HOURS_MS = 6 * 60 * 60 * 1000;
const PLANS = [
  { key: "weekly", label: "Mingguan", price: "Rp19.000", period: "/minggu", days: 7 },
  { key: "monthly", label: "Bulanan", price: "Rp59.000", period: "/bulan", days: 30, badge: "Populer" },
  { key: "yearly", label: "Tahunan", price: "Rp449.000", period: "/tahun", days: 365, badge: "Hemat 37%" },
];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function NovaAIApp() {
  const [stats, setStats] = useState({
    xp: 0,
    streak: 0,
    lastPlayDate: null,
    membership: { tier: "free", expiresAt: null },
    energy: MAX_ENERGY,
    energyRefillAt: null,
  });
  const [loaded, setLoaded] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [authError, setAuthError] = useState(null);
  const [screen, setScreen] = useState("home");
  const [subjectKey, setSubjectKey] = useState("matematika");
  const [topicKey, setTopicKey] = useState(null);
  const [queue, setQueue] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [hearts, setHearts] = useState(3);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [correctCount, setCorrectCount] = useState(0);
  const [sessionXp, setSessionXp] = useState(0);
  const [failed, setFailed] = useState(false);
  const [isAISession, setIsAISession] = useState(false);
  const [aiTopicLoading, setAiTopicLoading] = useState(null);
  const [aiError, setAiError] = useState(null);
  const [solverInput, setSolverInput] = useState("");
  const [solverLoading, setSolverLoading] = useState(false);
  const [solverAnswer, setSolverAnswer] = useState(null);
  const [solverError, setSolverError] = useState(null);

  // Muat progres tersimpan (pakai localStorage bawaan browser)
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setStats((prev) => ({ ...prev, ...parsed }));
      }
    } catch (e) {
      // belum ada data tersimpan, pakai default
    }
    setLoaded(true);
  }, []);

  const persist = useCallback(
    (next) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      } catch (e) {
        console.error("Gagal menyimpan progres", e);
      }
      if (user && db) {
        db.collection("users").doc(user.uid).set(next).catch((e) => console.error("Gagal sync ke cloud", e));
      }
    },
    [user]
  );

  // Pantau status login Google
  useEffect(() => {
    if (!auth) {
      setAuthLoading(false);
      return;
    }
    const unsub = auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthLoading(false);
    });
    auth.getRedirectResult().catch((e) => setAuthError(e.message || "Gagal masuk."));
    return () => unsub();
  }, []);

  // Saat berhasil login, tarik data dari cloud (atau unggah data lokal kalau belum pernah login)
  useEffect(() => {
    if (!user || !db) return;
    const ref = db.collection("users").doc(user.uid);
    ref
      .get()
      .then((snap) => {
        if (snap.exists) {
          setStats((prev) => ({ ...prev, ...snap.data() }));
        } else {
          ref.set(stats).catch(() => {});
        }
      })
      .catch((e) => console.error("Gagal ambil data cloud", e));
  }, [user]);

  const signInGoogle = () => {
    if (!auth) {
      setAuthError("Firebase belum dikonfigurasi.");
      return;
    }
    setAuthError(null);
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithRedirect(provider).catch((e) => setAuthError(e.message || "Gagal masuk."));
  };

  const signOutUser = () => {
    if (!auth) return;
    auth.signOut();
  };

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setStats((prev) => {
      let changed = false;
      let next = { ...prev };
      if (next.membership && next.membership.tier !== "free" && next.membership.expiresAt && next.membership.expiresAt <= now) {
        next.membership = { tier: "free", expiresAt: null };
        next.energy = MAX_ENERGY;
        next.energyRefillAt = null;
        changed = true;
      }
      const memberActive = next.membership && next.membership.tier !== "free" && next.membership.expiresAt > now;
      if (!memberActive && next.energyRefillAt && now >= next.energyRefillAt) {
        next.energy = MAX_ENERGY;
        next.energyRefillAt = null;
        changed = true;
      }
      if (changed) {
        persist(next);
        return next;
      }
      return prev;
    });
  }, [now, loaded, persist]);

  const isMemberActive = !!(stats.membership && stats.membership.tier !== "free" && stats.membership.expiresAt && stats.membership.expiresAt > now);

  const hasEnergyOrMember = () => {
    const memberActive = stats.membership && stats.membership.tier !== "free" && stats.membership.expiresAt && stats.membership.expiresAt > Date.now();
    return memberActive || stats.energy > 0;
  };

  const spendEnergy = () => {
    setStats((prev) => {
      const memberActive = prev.membership && prev.membership.tier !== "free" && prev.membership.expiresAt && prev.membership.expiresAt > Date.now();
      if (memberActive) return prev;
      const wasFull = prev.energy >= MAX_ENERGY;
      const nextEnergy = Math.max(0, prev.energy - 1);
      const next = { ...prev, energy: nextEnergy, energyRefillAt: wasFull ? Date.now() + SIX_HOURS_MS : prev.energyRefillAt };
      persist(next);
      return next;
    });
  };

  const startTopic = (subject, topic, customQuestions = null, aiFlag = false) => {
    const qs = customQuestions ? customQuestions : shuffle(SUBJECTS[subject].topics[topic].questions);
    setSubjectKey(subject);
    setTopicKey(topic);
    setQueue(qs);
    setQIndex(0);
    setHearts(3);
    setSelected(null);
    setAnswered(false);
    setCorrectCount(0);
    setSessionXp(0);
    setFailed(false);
    setIsAISession(aiFlag);
    setScreen("practice");
  };

  const restartSession = () => {
    setQueue((q) => shuffle(q));
    setQIndex(0);
    setHearts(3);
    setSelected(null);
    setAnswered(false);
    setCorrectCount(0);
    setSessionXp(0);
    setFailed(false);
    setScreen("practice");
  };

  const attemptStartTopic = (subject, topic) => {
    if (!hasEnergyOrMember()) {
      setScreen("energy");
      return;
    }
    spendEnergy();
    startTopic(subject, topic);
  };

  const attemptRestart = () => {
    if (!hasEnergyOrMember()) {
      setScreen("energy");
      return;
    }
    spendEnergy();
    restartSession();
  };

  const currentQ = queue[qIndex];

  const handleSelect = (idx) => {
    if (answered) return;
    setSelected(idx);
    setAnswered(true);
    if (idx === currentQ.correct) {
      setCorrectCount((c) => c + 1);
      setSessionXp((x) => x + 10);
    } else {
      setHearts((h) => Math.max(0, h - 1));
    }
  };

  const finishSession = useCallback(
    (heartsLeft) => {
      const today = new Date().toDateString();
      let nextStreak = stats.streak;
      if (stats.lastPlayDate !== today) {
        const yesterday = new Date(Date.now() - 86400000).toDateString();
        nextStreak = stats.lastPlayDate === yesterday ? stats.streak + 1 : 1;
      }
      setStats((prev) => {
        const next = { ...prev, xp: prev.xp + sessionXp, streak: nextStreak, lastPlayDate: today };
        persist(next);
        return next;
      });
      setFailed(heartsLeft <= 0);
      setScreen("summary");
    },
    [stats.streak, stats.lastPlayDate, sessionXp, persist]
  );

  const handleNext = () => {
    if (hearts <= 0) {
      finishSession(0);
      return;
    }
    if (qIndex + 1 >= queue.length) {
      finishSession(hearts);
    } else {
      setQIndex((i) => i + 1);
      setSelected(null);
      setAnswered(false);
    }
  };

  // ---- Pemanggilan Gemini API ----
  // GANTI teks di bawah dengan API key Gemini kamu sendiri dari aistudio.google.com
  // JANGAN lupa batasi key itu ke domain github.io kamu (lihat penjelasan chat).
  const GEMINI_API_KEY = "AQ.Ab8RN6LhSX3GfDMWHNpiSVzpVnH-7SRxgqVh4fV_oFL0wDFExw";
  const GEMINI_MODEL = "gemini-2.5-flash";

  const callClaudeAPI = async (system, userText) => {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: system }] },
          contents: [{ role: "user", parts: [{ text: userText }] }],
        }),
      }
    );
    const data = await response.json();
    if (data.error) throw new Error(data.error.message || "Kesalahan API");
    const parts = data.candidates && data.candidates[0] && data.candidates[0].content ? data.candidates[0].content.parts : [];
    const text = (parts || []).map((p) => p.text || "").join("\n").trim();
    if (!text) throw new Error("Respons kosong");
    return text;
  };

  const generateAIQuestions = async (subject, topic) => {
    if (aiTopicLoading) return;
    setAiError(null);
    setAiTopicLoading(topic);
    try {
      const subjectLabel = SUBJECTS[subject].label;
      const topicLabel = SUBJECTS[subject].topics[topic].label;
      const system = `Kamu adalah pembuat soal latihan Matematika/Sains untuk siswa SMP-SMA di Indonesia.
Balas HANYA dengan JSON valid, tanpa markdown, tanpa teks lain di luar JSON.
Format persis seperti ini, array berisi 5 objek:
[{"q":"teks soal","options":["opsi1","opsi2","opsi3","opsi4"],"correct":0,"tip":"penjelasan singkat 1 kalimat"}]
"correct" adalah indeks (0-3) jawaban benar di dalam "options". Semua teks berbahasa Indonesia dan ringkas.`;
      const userMsg = `Buat 5 soal latihan baru tentang topik "${topicLabel}" dalam mata pelajaran ${subjectLabel}, tingkat kesulitan menengah. Variasikan angka dan konteks soal, jangan mengulang pola yang itu-itu saja.`;
      const raw = await callClaudeAPI(system, userMsg);
      const cleaned = raw.replace(/```json|```/g, "").trim();
      const match = cleaned.match(/\[[\s\S]*\]/);
      const parsed = JSON.parse(match ? match[0] : cleaned);
      const valid = (Array.isArray(parsed) ? parsed : []).filter(
        (p) => p && typeof p.q === "string" && Array.isArray(p.options) && p.options.length === 4 && Number.isInteger(p.correct) && p.correct >= 0 && p.correct <= 3
      );
      if (valid.length === 0) throw new Error("Format tidak valid");
      spendEnergy();
      startTopic(subject, topic, valid, true);
    } catch (e) {
      setAiError("Gagal membuat soal dari AI. Cek API key Gemini kamu di kode, atau coba lagi ya.");
      setTimeout(() => setAiError(null), 5000);
    } finally {
      setAiTopicLoading(null);
    }
  };

  const attemptGenerateAI = (subject, topic) => {
    if (!hasEnergyOrMember()) {
      setScreen("energy");
      return;
    }
    generateAIQuestions(subject, topic);
  };

  const handleSolve = async () => {
    if (!solverInput.trim() || solverLoading) return;
    setSolverLoading(true);
    setSolverAnswer(null);
    setSolverError(null);
    try {
      const system = `Kamu adalah tutor Matematika dan Sains yang sabar dan suportif untuk siswa SMP-SMA di Indonesia. Jika pengguna memberi soal hitung, selesaikan langkah demi langkah dengan bahasa sederhana, lalu tutup dengan baris baru berformat "Jawaban: <hasil akhir>". Jika pertanyaannya berupa konsep, jelaskan singkat disertai contoh sederhana. Gunakan Bahasa Indonesia. Tulis pecahan dan pangkat dengan notasi biasa seperti 3/4 atau x^2, jangan gunakan notasi LaTeX.`;
      const answer = await callClaudeAPI(system, solverInput.trim());
      setSolverAnswer(answer);
    } catch (e) {
      setSolverError("Terjadi kesalahan. Cek API key Gemini kamu di kode, atau coba lagi ya.");
    } finally {
      setSolverLoading(false);
    }
  };

  const purchaseMembership = (tier) => {
    const plan = PLANS.find((p) => p.key === tier);
    if (!plan) return;
    const expiresAt = Date.now() + plan.days * 24 * 60 * 60 * 1000;
    setStats((prev) => {
      const next = { ...prev, membership: { tier, expiresAt }, energy: MAX_ENERGY, energyRefillAt: null };
      persist(next);
      return next;
    });
    setScreen("home");
  };

  const handleAdComplete = () => {
    setStats((prev) => {
      const nextEnergy = Math.min(MAX_ENERGY, prev.energy + 1);
      const next = { ...prev, energy: nextEnergy, energyRefillAt: nextEnergy >= MAX_ENERGY ? null : prev.energyRefillAt };
      persist(next);
      return next;
    });
    setScreen("home");
  };

  if (!loaded) return null;

  const subject = SUBJECTS[subjectKey];
  const praise = PRAISE[qIndex % PRAISE.length];

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "radial-gradient(circle at 20% 10%, #1c3a33 0%, #16302b 45%, #10221d 100%)",
        fontFamily: "'Nunito Sans', 'Inter', sans-serif",
        color: "#FBF3E3",
        display: "flex",
        justifyContent: "center",
        padding: "20px 14px 40px",
      }}
    >
      <div style={{ width: "100%", maxWidth: 460 }}>
        {screen === "home" && (
          <HomeScreen
            subject={subject}
            subjectKey={subjectKey}
            setSubjectKey={setSubjectKey}
            stats={stats}
            isMemberActive={isMemberActive}
            user={user}
            onOpenAccount={() => setScreen("account")}
            onStart={attemptStartTopic}
            aiTopicLoading={aiTopicLoading}
            aiError={aiError}
            onGenerateAI={attemptGenerateAI}
            onOpenSolver={() => setScreen("solver")}
            onOpenMembership={() => setScreen("membership")}
          />
        )}
        {screen === "practice" && currentQ && (
          <PracticeScreen
            subject={subject}
            topicLabel={subject.topics[topicKey].label}
            isAI={isAISession}
            question={currentQ}
            qIndex={qIndex}
            total={queue.length}
            hearts={hearts}
            selected={selected}
            answered={answered}
            praise={praise}
            onSelect={handleSelect}
            onNext={handleNext}
            onQuit={() => setScreen("home")}
          />
        )}
        {screen === "summary" && (
          <SummaryScreen
            failed={failed}
            correctCount={correctCount}
            total={queue.length}
            sessionXp={sessionXp}
            streak={stats.streak}
            onRetry={attemptRestart}
            onHome={() => setScreen("home")}
          />
        )}
        {screen === "solver" && (
          <SolverScreen
            input={solverInput}
            setInput={setSolverInput}
            loading={solverLoading}
            answer={solverAnswer}
            error={solverError}
            onSolve={handleSolve}
            onBack={() => setScreen("home")}
          />
        )}
        {screen === "membership" && (
          <MembershipScreen stats={stats} now={now} onPurchase={purchaseMembership} onBack={() => setScreen("home")} />
        )}
        {screen === "energy" && (
          <EnergyScreen
            now={now}
            energyRefillAt={stats.energyRefillAt}
            onWatchAd={() => setScreen("ad")}
            onOpenMembership={() => setScreen("membership")}
            onBack={() => setScreen("home")}
          />
        )}
        {screen === "ad" && <AdScreen onComplete={handleAdComplete} onCancel={() => setScreen("energy")} />}
        {screen === "account" && (
          <AccountScreen user={user} authLoading={authLoading} authError={authError} onSignIn={signInGoogle} onSignOut={signOutUser} onBack={() => setScreen("home")} />
        )}
      </div>
    </div>
  );
}

      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {question.options.map((opt, idx) => {
          let border = "2px solid rgba(255,255,255,0.15)";

}

          <Icon size={17}>↺</Icon> Coba lagi
        </button>
        <button onClick={onHome} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "14px", borderRadius: 12, border: "2px solid rgba(255,255,255,0.2)", background: "transparent", color: "#FBF3E3", fontWeight: 800, fontSize: 15 }}>
          <Icon size={17}>🏠</Icon> Kembali ke beranda
        </button>
      </div>
    </div>
  );
}

function SolverScreen({ input, setInput, loading, answer, error, onSolve, onBack }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button onClick={onBack} aria-label="Kembali" style={{ background: "none", border: "none", color: "#B9CFC7", display: "flex" }}>
          <Icon size={20}>←</Icon>
        </button>
        <div className="chalk-title" style={{ fontSize: 19, fontWeight: 700 }}>Tanya AI</div>
      </div>

      <p style={{ color: "#B9CFC7", fontSize: 13.5, marginBottom: 14 }}>Tulis soal Matematika atau Sains, atau pertanyaan konsep apa pun. AI akan membantu menyelesaikan dan menjelaskan langkahnya.</p>

      <textarea
        value={input}
        onChange={(e) => setInput(e.target.value)}
        placeholder='Contoh: "3x - 4 = 11, berapa x?" atau "Kenapa langit berwarna biru?"'
        rows={4}
        style={{ width: "100%", borderRadius: 14, padding: 14, fontSize: 15, border: "none", resize: "vertical", color: "#1C2B24", background: "#FBF3E3", fontFamily: "inherit", boxSizing: "border-box" }}
      />

      <button
        onClick={onSolve}
        disabled={loading || !input.trim()}
        style={{ marginTop: 12, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "14px", borderRadius: 12, border: "none", background: loading || !input.trim() ? "rgba(244,197,80,0.4)" : "#F4C550", color: "#1C2B24", fontWeight: 800, fontSize: 15 }}
      >
        {loading ? (<><Spinner /> Nova AI sedang berpikir...</>) : (<><Icon size={16}>➤</Icon> Selesaikan</>)}
      </button>

      {error && <div style={{ color: "#F0A98F", marginTop: 12, fontSize: 13.5 }}>{error}</div>}

      {answer && (
        <div style={{ marginTop: 20, background: "#FBF3E3", color: "#1C2B24", borderRadius: 14, padding: "18px 16px", fontSize: 14.5, lineHeight: 1.65 }}>
          {answer.split("\n").map((line, i) => {
            const isAnswerLine = /^jawaban\s*:/i.test(line.trim());
            return (
              <div key={i} style={{ fontWeight: isAnswerLine ? 800 : 400, color: isAnswerLine ? "#B5842F" : "#1C2B24", marginTop: isAnswerLine ? 10 : line.trim() === "" ? 8 : 0 }}>
                {line.trim() === "" ? "\u00A0" : line}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MembershipScreen({ stats, now, onPurchase, onBack }) {
  const active = stats.membership && stats.membership.tier !== "free" && stats.membership.expiresAt > now;
  const activePlan = active ? PLANS.find((p) => p.key === stats.membership.tier) : null;
  const expiresLabel = active ? new Date(stats.membership.expiresAt).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }) : null;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button onClick={onBack} aria-label="Kembali" style={{ background: "none", border: "none", color: "#B9CFC7" }}>
          <Icon size={20}>←</Icon>
        </button>
        <div className="chalk-title" style={{ fontSize: 19, fontWeight: 700 }}>Nova AI Premium</div>
      </div>

      {active ? (
        <div style={{ background: "rgba(244,197,80,0.12)", border: "2px solid #F4C550", borderRadius: 16, padding: 18, marginBottom: 22 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <Icon size={18}>👑</Icon>
            <span style={{ fontWeight: 800, fontSize: 16 }}>Member {activePlan ? activePlan.label : ""}</span>
          </div>
          <div style={{ fontSize: 13, color: "#D9E8E1" }}>Berlaku hingga {expiresLabel}</div>
        </div>
      ) : (
        <p style={{ color: "#B9CFC7", fontSize: 14.5, marginBottom: 18 }}>Latihan tanpa batas energi dan tanpa iklan.</p>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 8 }}>
        {["Energi tak terbatas, latihan sepuasnya", "Tanpa iklan", "Buat soal AI tanpa batas"].map((b, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, color: "#D9E8E1" }}>
            <Icon size={15} color="#6FBF8F">✓</Icon> {b}
          </div>
        ))}
      </div>

      <div style={{ height: 1, background: "rgba(255,255,255,0.1)", margin: "20px 0 16px" }} />

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {PLANS.map((p) => (
          <div key={p.key} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#FBF3E3", color: "#1C2B24", borderRadius: 14, padding: "16px 18px" }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 800, fontSize: 16 }}>{p.label}</span>
                {p.badge && (
                  <span style={{ fontSize: 10.5, fontWeight: 800, color: "#fff", background: p.key === "yearly" ? "#E2694F" : "#6FBFB0", borderRadius: 999, padding: "2px 7px" }}>{p.badge}</span>
                )}
              </div>
              <div style={{ fontSize: 13, color: "#5C6F65", marginTop: 2 }}>
                <span style={{ fontWeight: 700, color: "#1C2B24" }}>{p.price}</span> {p.period}
              </div>
            </div>
            <button onClick={() => onPurchase(p.key)} style={{ padding: "10px 18px", borderRadius: 10, border: "none", background: "#1C2B24", color: "#FBF3E3", fontWeight: 800, fontSize: 13.5 }}>Pilih</button>
          </div>
        ))}
      </div>

      <p style={{ color: "#5C6F65", fontSize: 11, marginTop: 18, textAlign: "center" }}>*Harga contoh untuk demo. Pembayaran nyata memerlukan integrasi Google Play Billing.</p>
    </div>
  );
}

function EnergyScreen({ now, energyRefillAt, onWatchAd, onOpenMembership, onBack }) {
  const remainingMs = energyRefillAt ? Math.max(0, energyRefillAt - now) : 0;
  const h = Math.floor(remainingMs / 3600000);
  const m = Math.floor((remainingMs % 3600000) / 60000);
  const s = Math.floor((remainingMs % 60000) / 1000);
  const pad = (n) => String(n).padStart(2, "0");

  return (
    <div style={{ textAlign: "center", paddingTop: 40 }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
        <div style={{ width: 84, height: 84, borderRadius: "50%", background: "rgba(127,209,224,0.15)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon size={38}>⚡</Icon>
        </div>
      </div>
      <div className="chalk-title" style={{ fontSize: 23, fontWeight: 800, marginBottom: 6 }}>Energi Habis</div>
      <p style={{ color: "#B9CFC7", fontSize: 14, marginBottom: 4 }}>Energi kamu terisi penuh lagi dalam:</p>
      <div className="chalk-title" style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 26, fontWeight: 800, marginBottom: 26 }}>
        <Icon size={20}>🕐</Icon> {pad(h)}:{pad(m)}:{pad(s)}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <button onClick={onWatchAd} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "14px", borderRadius: 12, border: "none", background: "#7FD1E0", color: "#0F211D", fontWeight: 800, fontSize: 15 }}>
          <Icon size={17}>📺</Icon> Tonton Iklan (+1 Energi)
        </button>
        <button onClick={onOpenMembership} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "14px", borderRadius: 12, border: "none", background: "#F4C550", color: "#1C2B24", fontWeight: 800, fontSize: 15 }}>
          <Icon size={17}>👑</Icon> Lihat Membership
        </button>
        <button onClick={onBack} style={{ padding: "12px", borderRadius: 12, border: "2px solid rgba(255,255,255,0.2)", background: "transparent", color: "#FBF3E3", fontWeight: 700, fontSize: 14.5 }}>Kembali</button>
      </div>
    </div>
  );
}

function AdScreen({ onComplete, onCancel }) {
  const [progress, setProgress] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => {
    const duration = 4000;
    const start = Date.now();
    const id = setInterval(() => {
      const pct = Math.min(100, ((Date.now() - start) / duration) * 100);
      setProgress(pct);
      if (pct >= 100) { clearInterval(id); setDone(true); }
    }, 100);
    return () => clearInterval(id);
  }, []);

  return (
    <div style={{ textAlign: "center", paddingTop: 50 }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 20 }}>
        <div style={{ width: 84, height: 84, borderRadius: "50%", background: "rgba(127,209,224,0.15)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon size={36}>{done ? "✓" : "📺"}</Icon>
        </div>
      </div>

      {!done ? (
        <>
          <div className="chalk-title" style={{ fontSize: 19, fontWeight: 700, marginBottom: 14 }}>Iklan sedang diputar...</div>
          <div style={{ height: 10, borderRadius: 6, background: "rgba(255,255,255,0.12)", overflow: "hidden", marginBottom: 20 }}>
            <div style={{ width: `${progress}%`, height: "100%", background: "#7FD1E0", transition: "width 0.1s linear" }} />
          </div>
          <button onClick={onCancel} style={{ background: "none", border: "none", color: "#9FB8AE", fontSize: 13.5 }}>Lewati</button>
        </>
      ) : (
        <>
          <div className="chalk-title" style={{ fontSize: 20, fontWeight: 800, marginBottom: 8 }}>Terima kasih!</div>
          <p style={{ color: "#B9CFC7", fontSize: 14, marginBottom: 20 }}>+1 Energi telah ditambahkan.</p>
          <button onClick={onComplete} style={{ width: "100%", padding: "14px", borderRadius: 12, border: "none", background: "#7FD1E0", color: "#0F211D", fontWeight: 800, fontSize: 15 }}>Lanjutkan</button>
        </>
      )}

      <p style={{ color: "#5C6F65", fontSize: 11, marginTop: 24 }}>*Simulasi iklan untuk demo. Integrasikan AdMob saat aplikasi dipublikasikan.</p>
    </div>
  );
}

function AccountScreen({ user, authLoading, authError, onSignIn, onSignOut, onBack }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button onClick={onBack} aria-label="Kembali" style={{ background: "none", border: "none", color: "#B9CFC7" }}>
          <Icon size={20}>←</Icon>
        </button>
        <div className="chalk-title" style={{ fontSize: 19, fontWeight: 700 }}>Akun</div>
      </div>

      {authLoading ? (
        <div style={{ textAlign: "center", padding: "40px 0", color: "#B9CFC7", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          <Spinner /> Memuat...
        </div>
      ) : user ? (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 14, background: "#FBF3E3", color: "#1C2B24", borderRadius: 16, padding: 18, marginBottom: 16 }}>
            {user.photoURL ? (
              <img src={user.photoURL} alt="" style={{ width: 48, height: 48, borderRadius: "50%" }} />
            ) : (
              <div style={{ width: 48, height: 48, borderRadius: "50%", background: "#F4C550", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 20 }}>
                {(user.displayName || user.email || "?").charAt(0).toUpperCase()}
              </div>
            )}
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 800, fontSize: 15 }}>{user.displayName || "Pengguna"}</div>
              <div style={{ fontSize: 12.5, color: "#5C6F65", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{user.email}</div>
            </div>
          </div>
          <p style={{ color: "#B9CFC7", fontSize: 13, marginBottom: 18 }}>
            Progres kamu otomatis tersimpan ke cloud dan bisa dibuka lagi dari HP lain dengan akun Google yang sama.
          </p>
          <button
            onClick={onSignOut}
            style={{ width: "100%", padding: "14px", borderRadius: 12, border: "2px solid rgba(255,255,255,0.2)", background: "transparent", color: "#FBF3E3", fontWeight: 800, fontSize: 15 }}
          >
            Keluar
          </button>
        </div>
      ) : (
        <div>
          <p style={{ color: "#B9CFC7", fontSize: 14.5, marginBottom: 20 }}>
            Masuk dengan akun Google supaya progres, XP, dan streak kamu tersimpan aman dan bisa dibuka dari HP mana pun.
          </p>
          <button
            onClick={onSignIn}
            style={{ width: "100%", padding: "14px", borderRadius: 12, border: "none", background: "#FBF3E3", color: "#1C2B24", fontWeight: 800, fontSize: 15 }}
          >
            Masuk dengan Google
          </button>
          {authError && <div style={{ color: "#F0A98F", marginTop: 12, fontSize: 13.5 }}>{authError}</div>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NovaAIApp />);
</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
