function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function formatTodayLabel(ts) {
  try {
    const s = new Date(ts).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long" });
    return s.replace(/\b\w/g, (c) => c.toUpperCase());
  } catch (e) {
    return "";
  }
}

function subjectTotalQuestions(key) {
  return Object.values(SUBJECTS[key].topics).reduce((a, t) => a + t.questions.length, 0);
}

function computeSubjectPct(stats, key) {
  const total = subjectTotalQuestions(key);
  const correct = (stats.subjectProgress && stats.subjectProgress[key] && stats.subjectProgress[key].correct) || 0;
  return total > 0 ? Math.min(100, Math.round((correct / total) * 100)) : 0;
}

  const [isAISession, setIsAISession] = useState(false);

  const [solverInput, setSolverInput] = useState("");
  const [solverLoading, setSolverLoading] = useState(false);
  const [solverAnswer, setSolverAnswer] = useState(null);
  const [solverError, setSolverError] = useState(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setStats((prev) => ({ ...prev, ...parsed }));
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  const persist = useCallback(
    (next) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      } catch (e) {
        console.error("Gagal menyimpan progres", e);
      }
      if (user && db) {
        const payload = { ...next, displayName: user.displayName || null, photoURL: user.photoURL || null };
        db.collection("users").doc(user.uid).set(payload, { merge: true }).catch((e) => console.error("Gagal sync ke cloud", e));
      }
    },
    [user]
  );

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    if (!auth) {
      setAuthLoading(false);
      return;
    }
    const unsub = auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthLoading(false);
    });
    auth.getRedirectResult().catch((e) => setAuthError(e.message || "Gagal masuk."));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user || !db) return;
    const ref = db.collection("users").doc(user.uid);
    ref
      .get()
      .then((snap) => {
        if (snap.exists) {
          setStats((prev) => ({ ...prev, ...snap.data() }));
        } else {
          ref.set({ ...stats, displayName: user.displayName || null, photoURL: user.photoURL || null }).catch(() => {});
        }
      })
      .catch((e) => console.error("Gagal ambil data cloud", e));
  }, [user]);

  const signInGoogle = () => {
    if (!auth) {
      setAuthError("Firebase belum dikonfigurasi.");
      return;
    }
    setAuthError(null);
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithRedirect(provider).catch((e) => setAuthError(e.message || "Gagal masuk."));
  };

  const signOutUser = () => {
    if (!auth) return;
    auth.signOut();
  };

  useEffect(() => {
    if (!loaded) return;
    setStats((prev) => {
      let changed = false;
      let next = { ...prev };
      if (next.membership && next.membership.tier !== "free" && next.membership.expiresAt && next.membership.expiresAt <= now) {
        next.membership = { tier: "free", expiresAt: null };
        next.energy = MAX_ENERGY;
        next.energyRefillAt = null;
        changed = true;
      }
      const memberActive = next.membership && next.membership.tier !== "free" && next.membership.expiresAt > now;
      if (!memberActive && next.energyRefillAt && now >= next.energyRefillAt) {
        next.energy = MAX_ENERGY;
        next.energyRefillAt = null;
        changed = true;
      }
      if (changed) {
        persist(next);
        return next;
      }
      return prev;
    });
  }, [now, loaded, persist]);

  const isMemberActive = !!(stats.membership && stats.membership.tier !== "free" && stats.membership.expiresAt && stats.membership.expiresAt > now);

  const hasEnergyOrMember = () => {
    const memberActive = stats.membership && stats.membership.tier !== "free" && stats.membership.expiresAt && stats.membership.expiresAt > Date.now();

    setStats((prev) => {
      const memberActive = prev.membership && prev.membership.tier !== "free" && prev.membership.expiresAt && prev.membership.expiresAt > Date.now();
      if (memberActive) return prev;
      const wasFull = prev.energy >= MAX_ENERGY;
      const nextEnergy = Math.max(0, prev.energy - 1);
      const next = { ...prev, energy: nextEnergy, energyRefillAt: wasFull ? Date.now() + SIX_HOURS_MS : prev.energyRefillAt };
      persist(next);
      return next;
    });
  };

  const startTopic = (subject, topic, customQuestions = null, aiFlag = false) => {
    const qs = customQuestions ? customQuestions : shuffle(SUBJECTS[subject].topics[topic].questions);
    setSubjectKey(subject);
    setTopicKey(topic);
    setQueue(qs);
    setQIndex(0);
    setHearts(3);
    setSelected(null);
    setAnswered(false);
    setCorrectCount(0);
    setSessionXp(0);
    setFailed(false);
    setIsAISession(aiFlag);
    setScreen("practice");
  };

  const restartSession = () => {
    setQueue((q) => shuffle(q));
    setQIndex(0);
    setHearts(3);
    setSelected(null);
    setAnswered(false);
    setCorrectCount(0);
    setSessionXp(0);
    setFailed(false);
    setScreen("practice");
  };

  const attemptStartTopic = (subject, topic) => {
    if (!hasEnergyOrMember()) {
      setScreen("energy");
      return;
    }
    spendEnergy();
    startTopic(subject, topic);
  };

  const attemptRestart = () => {
    if (!hasEnergyOrMember()) {
      setScreen("energy");
      return;
    }
    spendEnergy();
    restartSession();
  };

  const currentQ = queue[qIndex];

  const handleSelect = (idx) => {
    if (answered) return;
    setSelected(idx);
    setAnswered(true);
    if (idx === currentQ.correct) {
      setCorrectCount((c) => c + 1);
      setSessionXp((x) => x + 10);
    } else {
      setHearts((h) => Math.max(0, h - 1));
    }
  };

  const finishSession = useCallback(
    (heartsLeft) => {
      const today = new Date().toDateString();
      setStats((prev) => {
        let nextStreak = prev.streak;
        if (prev.lastPlayDate !== today) {
          const yesterday = new Date(Date.now() - 86400000).toDateString();
          nextStreak = prev.lastPlayDate === yesterday ? prev.streak + 1 : 1;
        }
        const dailyPrev = prev.dailyAnswered && prev.dailyAnswered.date === today ? prev.dailyAnswered.count : 0;
        const prevSubj = (prev.subjectProgress && prev.subjectProgress[subjectKey]) || { correct: 0, answered: 0 };
        const next = {
          ...prev,
          xp: prev.xp + sessionXp,
          streak: nextStreak,
          lastPlayDate: today,
          dailyAnswered: { date: today, count: dailyPrev + queue.length },
          subjectProgress: {
            ...prev.subjectProgress,
            [subjectKey]: { correct: prevSubj.correct + correctCount, answered: prevSubj.answered + queue.length },
          },
        };
        persist(next);
        return next;
      });
      setFailed(heartsLeft <= 0);
      setScreen("summary");
    },
    [sessionXp, subjectKey, correctCount, queue.length, persist]
  );

  const handleNext = () => {
    if (hearts <= 0) {
      finishSession(0);
      return;
    }
    if (qIndex + 1 >= queue.length) {
      finishSession(hearts);
    } else {
      setQIndex((i) => i + 1);
      setSelected(null);
      setAnswered(false);
    }
  };

  const callGeminiAPI = async (system, userText) => {
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=AQ.Ab8RN6LhSX3GfDMWHNpiSVzpVnH-7SRxgqVh4fV_oFL0wDFExw",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: system }] },
          contents: [{ role: "user", parts: [{ text: userText }] }],
        }),
      }
    );
    const data = await response.json();
    if (data.error) throw new Error(data.error.message || "Kesalahan API");
    const parts = data.candidates && data.candidates[0] && data.candidates[0].content ? data.candidates[0].content.parts : [];
    const text = (parts || []).map((p) => p.text || "").join("\n").trim();
    if (!text) throw new Error("Respons kosong");
    return text;
  };

  const generateAIQuestions = async (subject, topic) => {
    if (aiTopicLoading) return;
    setAiError(null);
    setAiTopicLoading(topic);
    try {
      const subjectLabel = SUBJECTS[subject].label;
      const topicLabel = SUBJECTS[subject].topics[topic].label;
      const system = `Kamu adalah pembuat soal latihan Matematika/Sains untuk siswa SMP-SMA di Indonesia.
Balas HANYA dengan JSON valid, tanpa markdown, tanpa teks lain di luar JSON.
Format persis seperti ini, array berisi 5 objek:
[{"q":"teks soal","options":["opsi1","opsi2","opsi3","opsi4"],"correct":0,"tip":"penjelasan singkat 1 kalimat"}]
"correct" adalah indeks (0-3) jawaban benar di dalam "options". Semua teks berbahasa Indonesia dan ringkas.`;
      const userMsg = `Buat 5 soal latihan baru tentang topik "${topicLabel}" dalam mata pelajaran ${subjectLabel}, tingkat kesulitan menengah. Variasikan angka dan konteks soal.`;
      const raw = await callGeminiAPI(system, userMsg);
      const cleaned = raw.replace(/```json|```/g, "").trim();
      const match = cleaned.match(/\[[\s\S]*\]/);
      const parsed = JSON.parse(match ? match[0] : cleaned);
      const valid = (Array.isArray(parsed) ? parsed : []).filter(
        (p) => p && typeof p.q === "string" && Array.isArray(p.options) && p.options.length === 4 && Number.isInteger(p.correct) && p.correct >= 0 && p.correct <= 3
      );
      if (valid.length === 0) throw new Error("Format tidak valid");
      spendEnergy();
      startTopic(subject, topic, valid, true);
    } catch (e) {
      setAiError("Gagal membuat soal dari AI. Coba lagi ya.");
      setTimeout(() => setAiError(null), 4000);
    } finally {
      setAiTopicLoading(null);
    }
  };

  const attemptGenerateAI = (subject, topic) => {
    if (!hasEnergyOrMember()) {
      setScreen("energy");
      return;
    }
    generateAIQuestions(subject, topic);
  };

  const handleSolve = async () => {
    if (!solverInput.trim() || solverLoading) return;
    setSolverLoading(true);
    setSolverAnswer(null);
    setSolverError(null);
    try {
      const system = `Kamu adalah tutor Matematika dan Sains yang sabar dan suportif untuk siswa SMP-SMA di Indonesia. Jika pengguna memberi soal hitung, selesaikan langkah demi langkah dengan bahasa sederhana, lalu tutup dengan baris baru berformat "Jawaban: <hasil akhir>". Jika pertanyaannya berupa konsep, jelaskan singkat disertai contoh sederhana. Gunakan Bahasa Indonesia. Tulis pecahan dan pangkat dengan notasi biasa seperti 3/4 atau x^2, jangan gunakan notasi LaTeX.`;
      const answer = await callGeminiAPI(system, solverInput.trim());
      setSolverAnswer(answer);
    } catch (e) {
      setSolverError("Terjadi kesalahan. Coba lagi ya.");
    } finally {
      setSolverLoading(false);
    }
  };

  const openSolver = (prefill) => {
    if (prefill) setSolverInput(prefill);
    setScreen("solver");
  };

  const purchaseMembership = (tier) => {
    const plan = PLANS.find((p) => p.key === tier);
    if (!plan) return;
    const expiresAt = Date.now() + plan.days * 24 * 60 * 60 * 1000;
    setStats((prev) => {
      const next = { ...prev, membership: { tier, expiresAt }, energy: MAX_ENERGY, energyRefillAt: null };
      persist(next);
      return next;
    });
    setScreen("account");
  };

  const handleAdComplete = () => {
    setStats((prev) => {
      const nextEnergy = Math.min(MAX_ENERGY, prev.energy + 1);
      const next = { ...prev, energy: nextEnergy, energyRefillAt: nextEnergy >= MAX_ENERGY ? null : prev.energyRefillAt };
      persist(next);
      return next;
    });
    setScreen("home");
  };

  if (!loaded) return null;

  const subject = SUBJECTS[subjectKey];
  const praise = PRAISE[qIndex % PRAISE.length];
  const isTabScreen = screen === "home" || screen === "leaderboard" || screen === "account";

  return (
    <div
      style={{
        minHeight: "100vh",
        background:
          "radial-gradient(circle at 12% 0%, rgba(124,58,237,0.16), transparent 40%), radial-gradient(circle at 100% 15%, rgba(255,100,82,0.12), transparent 35%), #101114",
        fontFamily: "'Inter', sans-serif",
        color: "#F5F6F8",
        display: "flex",
        justifyContent: "center",
      }}
    >
      <div style={{ width: "100%", maxWidth: 460, padding: `20px 16px ${isTabScreen ? 90 : 40}px` }}>
        {screen === "home" && (
          <HomeScreen
            stats={stats}
            now={now}
            user={user}
            isMemberActive={isMemberActive}
            subjectKey={subjectKey}
            setSubjectKey={setSubjectKey}
            onStart={attemptStartTopic}
            aiTopicLoading={aiTopicLoading}
            aiError={aiError}
            onGenerateAI={attemptGenerateAI}
            onOpenSolver={openSolver}
          />
        )}
        {screen === "leaderboard" && <LeaderboardScreen user={user} />}
        {screen === "account" && (
          <ProfilScreen
            user={user}
            authLoading={authLoading}
            authError={authError}
            stats={stats}
            isMemberActive={isMemberActive}
            onSignIn={signInGoogle}
            onSignOut={signOutUser}
            onOpenMembership={() => setScreen("membership")}
          />
        )}
        {screen === "practice" && currentQ && (
          <PracticeScreen
            subject={subject}
            topicLabel={subject.topics[topicKey].label}
            isAI={isAISession}
            question={currentQ}
            qIndex={qIndex}
            total={queue.length}
            hearts={hearts}
            selected={selected}
            answered={answered}
            praise={praise}
            onSelect={handleSelect}
            onNext={handleNext}
            onQuit={() => setScreen("home")}
          />
        )}
        {screen === "summary" && (
          <SummaryScreen
            failed={failed}
            correctCount={correctCount}
            total={queue.length}
            sessionXp={sessionXp}
            streak={stats.streak}
            onRetry={attemptRestart}
            onHome={() => setScreen("home")}
          />
        )}
        {screen === "solver" && (
          <SolverScreen
            input={solverInput}
            setInput={setSolverInput}
            loading={solverLoading}
            answer={solverAnswer}
            error={solverError}
            onSolve={handleSolve}
            onBack={() => setScreen("home")}
          />
        )}
        {screen === "membership" && (
          <MembershipScreen stats={stats} now={now} onPurchase={purchaseMembership} onBack={() => setScreen("account")} />
        )}
        {screen === "energy" && (
          <EnergyScreen
            now={now}
            energyRefillAt={stats.energyRefillAt}
            onWatchAd={() => setScreen("ad")}
            onOpenMembership={() => setScreen("membership")}
            onBack={() => setScreen("home")}
          />
        )}
        {screen === "ad" && <AdScreen onComplete={handleAdComplete} onCancel={() => setScreen("energy")} />}
      </div>
      {isTabScreen && <BottomNav screen={screen} setScreen={setScreen} />}
    </div>
  );
}

function PracticeScreen({ subject, topicLabel, isAI, question, qIndex, total, hearts, selected, answered, praise, onSelect, onNext, onQuit }) {

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button onClick={onQuit} aria-label="Tutup" style={{ background: "none", border: "none", color: "#9AA0AC" }}>

        </button>
        <div style={{ flex: 1, height: 8, borderRadius: 5, background: "rgba(255,255,255,0.08)", overflow: "hidden" }}>
          <div style={{ width: `${progressPct}%`, height: "100%", background: subject.accent, transition: "width 0.3s ease" }} />
        </div>
        <div style={{ display: "flex", gap: 3 }}>
          {[0, 1, 2].map((i) => (
            <Icon key={i} size={17} color={i < hearts ? "#FF6452" : "#3a3d45"}>{i < hearts ? "♥" : "♡"}</Icon>
          ))}
        </div>
      </div>

      <div style={{ fontSize: 11.5, color: "#767C88", marginBottom: 10, fontWeight: 800, letterSpacing: 0.4 }}>
        {topicLabel.toUpperCase()}{isAI ? " · SOAL AI" : ""}

      <div style={{ background: "#1f2128", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 20, padding: "26px 22px", marginBottom: 20, minHeight: 90, display: "flex", alignItems: "center" }}>
        <div style={{ fontSize: 18, fontWeight: 700, lineHeight: 1.4, color: "#F5F6F8" }}>{question.q}</div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {question.options.map((opt, idx) => {
          let border = "1px solid rgba(255,255,255,0.1)";
          let bg = "#17181d";
          if (answered && idx === question.correct) { border = "1px solid #4ADE9E"; bg = "rgba(74,222,158,0.12)"; }
          else if (answered && idx === selected) { border = "1px solid #FF6452"; bg = "rgba(255,100,82,0.12)"; }
          else if (selected === idx) { border = `1px solid ${subject.accent}`; }
          return (
            <button key={idx} disabled={answered} onClick={() => onSelect(idx)} className="card-tap" style={{ textAlign: "left", padding: "14px 16px", borderRadius: 14, border, background: bg, color: "#F5F6F8", fontSize: 15, fontWeight: 600 }}>

        })}
      </div>

      {answered && (
        <div style={{ marginTop: 18, padding: "16px 18px", borderRadius: 16, background: isCorrect ? "rgba(74,222,158,0.1)" : "rgba(255,100,82,0.1)", border: `1px solid ${isCorrect ? "#4ADE9E" : "#FF6452"}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 800, fontSize: 15, color: isCorrect ? "#4ADE9E" : "#FF8A75" }}>
            <Icon size={18}>{isCorrect ? "✓" : "✕"}</Icon>

          <div style={{ fontSize: 12.5, color: "#B7BCC6", marginTop: 6 }}>{question.tip}</div>
          <button onClick={onNext} style={{ marginTop: 14, width: "100%", padding: 13, borderRadius: 12, border: "none", background: "#F5F6F8", color: "#101114", fontWeight: 800, fontSize: 14.5 }}>

function AdScreen({ onComplete, onCancel }) {
  const [progress, setProgress] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => {
    const duration = 4000;
    const start = Date.now();
    const id = setInterval(() => {
      const pct = Math.min(100, ((Date.now() - start) / duration) * 100);
      setProgress(pct);
      if (pct >= 100) { clearInterval(id); setDone(true); }
    }, 100);
    return () => clearInterval(id);
  }, []);

  return (
    <div style={{ textAlign: "center", paddingTop: 50 }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 20 }}>
        <div style={{ width: 80, height: 80, borderRadius: "50%", background: "rgba(74,195,217,0.15)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon size={34}>{done ? "✓" : "📺"}</Icon>
        </div>
      </div>
      {!done ? (
        <>
          <div className="font-display" style={{ fontSize: 17, fontWeight: 800, marginBottom: 14 }}>Iklan sedang diputar...</div>
          <div style={{ height: 8, borderRadius: 5, background: "rgba(255,255,255,0.08)", overflow: "hidden", marginBottom: 20 }}>
            <div style={{ width: `${progress}%`, height: "100%", background: "#4AC3D9", transition: "width 0.1s linear" }} />
          </div>
          <button onClick={onCancel} style={{ background: "none", border: "none", color: "#9AA0AC", fontSize: 13 }}>Lewati</button>
        </>
      ) : (
        <>
          <div className="font-display" style={{ fontSize: 18, fontWeight: 800, marginBottom: 8 }}>Terima kasih!</div>
          <p style={{ color: "#9AA0AC", fontSize: 13, marginBottom: 20 }}>+1 Energi telah ditambahkan.</p>
          <button onClick={onComplete} style={{ width: "100%", padding: 14, borderRadius: 14, border: "none", background: "#4AC3D9", color: "#0B2E36", fontWeight: 800, fontSize: 14.5 }}>Lanjutkan</button>
        </>
      )}
      <p style={{ color: "#767C88", fontSize: 10.5, marginTop: 24 }}>*Simulasi iklan untuk demo. Integrasikan AdMob saat aplikasi dipublikasikan.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NovaAIApp />);
</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
